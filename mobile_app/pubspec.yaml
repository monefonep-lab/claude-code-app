name: mobile_app
description: "Claude-Code Mobile App - AI-powered development on the go"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Core functionality
  http: ^1.1.2
  web_socket_channel: ^2.4.0
  
  # SSH connection
  dartssh2: ^2.9.1
  
  # State management
  provider: ^6.1.1
  
  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  
  # Voice recognition
  speech_to_text: ^7.0.0
  
  # UI components
  flutter_markdown: ^0.6.19
  loading_animation_widget: ^1.2.0+4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
